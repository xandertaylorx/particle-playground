<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Playground</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div><b>particle playground</b></div>
  <div>mode <b id="mode">attract</b> · colors <b id="pal">neon</b> · <b id="count">0</b> dots</div>
  <div><kbd>move</kbd> lead the swarm · <kbd>click</kbd> boom</div>
  <div><kbd>space</kbd> mode · <kbd>C</kbd> colors · <kbd>+</kbd>/<kbd>-</kbd> more/less</div>
  <div><kbd>F</kbd> fullscreen · <kbd>H</kbd> hide this</div>
</div>

<script src="src/main.js"></script>
</body>
</html>
