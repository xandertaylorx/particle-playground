<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Playground</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div><b>particle playground</b></div>
  <div>mode <b id="mode">attract</b> · colors <b id="pal">neon</b> · <b id="count">0</b> dots</div>
  <div><kbd>move</kbd> lead the swarm · <kbd>click</kbd> boom</div>
  <div><kbd>hold</kbd> charge a black hole, let go for a big one</div>
  <div><kbd>right-click</kbd> drop a gravity well · <kbd>X</kbd> clear them</div>
  <div><kbd>space</kbd> mode · <kbd>C</kbd> colors · <kbd>+</kbd>/<kbd>-</kbd> more/less</div>
  <div><kbd>F</kbd> fullscreen · <kbd>H</kbd> hide this</div>
  <div class="row" id="wordRow">
    <input id="word" maxlength="14" value="HELLO" spellcheck="false">
    <button id="spell">spell it</button>
  </div>
  <div class="row">
    <button id="mic">🎤 mic</button>
    <button id="song">🎵 load a song</button>
    <input type="file" id="file" accept="audio/*" hidden>
  </div>
  <div id="playing">…or just drag an mp3 onto the page</div>
</div>

<div id="drop">drop it 🎶</div>

<script src="src/main.js"></script>
<script src="src/audio.js"></script>
<script src="src/text.js"></script>
</body>
</html>
